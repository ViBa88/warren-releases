{{- if .Values.metrics.prometheusRule.enabled }}
# Prometheus Operator: the alerting rules of prometheus/warren-alerts.yml (files/warren-alerts.yml in the chart)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "warren.fullname" . }}
  labels:
    {{- include "warren.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/warren-alerts.yml" | nindent 2 }}
{{- end }}
