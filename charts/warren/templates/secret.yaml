{{- $fullname := include "warren.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "warren.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.admin.existingSecret }}
  {{- /* a generated password survives upgrades: read back from the Secret of the last release */ -}}
  {{- $generated := "" }}
  {{- if and $existing (index $existing.data .Values.admin.existingSecretKey) }}
  {{- $generated = index $existing.data .Values.admin.existingSecretKey | b64dec }}
  {{- else }}
  {{- $generated = randAlphaNum 20 }}
  {{- end }}
  {{ .Values.admin.existingSecretKey }}: {{ .Values.admin.password | default $generated | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.clusters) (not .Values.rabbitmq.existingSecret) }}
  {{ .Values.rabbitmq.existingSecretKey }}: {{ .Values.rabbitmq.password | b64enc | quote }}
  {{- end }}
  {{- range $i, $c := .Values.clusters }}
  {{- if not $c.existingSecret }}
  {{ printf "cluster-%d-password" $i }}: {{ $c.password | default "" | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.license.key (not .Values.license.existingSecret) }}
  {{ .Values.license.existingSecretKey }}: {{ .Values.license.key | b64enc | quote }}
  {{- end }}
  {{- if and .Values.externalDatabase.enabled (not .Values.externalDatabase.existingSecret) }}
  {{ .Values.externalDatabase.existingSecretKey }}: {{ .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
  {{- if and .Values.oidc.enabled (not .Values.oidc.existingSecret) }}
  {{ .Values.oidc.existingSecretKey }}: {{ .Values.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if and .Values.metrics.enabled (not .Values.metrics.existingSecret) }}
  {{- /* like the admin password: a generated token survives upgrades */ -}}
  {{- $token := "" }}
  {{- if and $existing (index $existing.data .Values.metrics.existingSecretKey) }}
  {{- $token = index $existing.data .Values.metrics.existingSecretKey | b64dec }}
  {{- else }}
  {{- $token = randAlphaNum 40 }}
  {{- end }}
  {{ .Values.metrics.existingSecretKey }}: {{ .Values.metrics.token | default $token | b64enc | quote }}
  {{- end }}
  {{- if and .Values.smtp.password (not .Values.smtp.existingSecret) }}
  {{ .Values.smtp.existingSecretKey }}: {{ .Values.smtp.password | b64enc | quote }}
  {{- end }}
