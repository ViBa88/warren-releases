{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) (not .Values.externalDatabase.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "warren.fullname" . }}
  labels:
    {{- include "warren.labels" . | nindent 4 }}
  annotations:
    # the audit log lives here: keep it when the release is uninstalled
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
